<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Ariadne — Import BOM</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        nav a { margin-right: 1rem; }
        label { display: inline-block; width: 130px; }
        .field { margin-bottom: 0.5rem; }
        .ok { color: green; }
        .err { color: red; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('import_bom') }}">Import BOM</a>
    </nav>
    <h1>Import BOM</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="post" enctype="multipart/form-data">
        <div class="field"><label>File BOM</label><input type="file" name="bom_file" required accept=".xlsx,.xls,.ods,.csv,.pdf"></div>
        <div class="field"><label>Brand</label><input type="text" name="brand"></div>
        <div class="field"><label>Modello</label><input type="text" name="model" placeholder="es. STEVAL-SPIN3204"></div>
        <div class="field"><label>Produttore</label><input type="text" name="manufacturer"></div>
        <div class="field"><label>Anno</label><input type="number" name="year" min="1900" max="2030"></div>
        <button type="submit">Importa</button>
    </form>
    <p>Formati supportati: {{ allowed }}</p>
</body>
</html>
