[project]
name = "ariadne"
version = "0.1.0"
description = "Ariadne Data-Driven Materials Recovery System — BOM processing pipeline"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "paramiko>=3.4",
    "pydantic>=2.7",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ariadne = "ariadne.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
